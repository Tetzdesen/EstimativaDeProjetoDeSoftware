# Tema claro do sistema de estimativa
@accentColor = #2563EB
@background = #F6F7F9

# ---- forma e tipografia ----
defaultFont = +1
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.margin = 5,14,5,14
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 11
TabbedPane.tabHeight = 34
TabbedPane.tabSelectionHeight = 3
TitlePane.unifiedBackground = true
ToolBar.margin = 4,6,4,6

# ---- tabelas ----
Table.rowHeight = 26
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
TableHeader.height = 30
TableHeader.font = bold

# ---- arvore ----
Tree.rowHeight = 28

Table.alternateRowColor = #F3F5F8
Table.gridColor = #E5E7EB
Table.selectionBackground = #DBE7FF
Table.selectionForeground = #111827
Table.selectionInactiveBackground = #E8EEFA
Table.selectionInactiveForeground = #111827
TableHeader.background = #EEF1F5
Desktop.background = #E9ECF1
InternalFrame.activeTitleBackground = #FFFFFF
InternalFrame.inactiveTitleBackground = #F3F4F6

# ---- cores do sistema ----
Estimativa.sucesso = #15803D
Estimativa.aviso = #B45309
Estimativa.erro = #DC2626
Estimativa.na = #9CA3AF
Estimativa.cartao = #FFFFFF
Estimativa.cartaoBorda = #E2E5EA
Estimativa.titulo = #111827
Estimativa.subtitulo = #6B7280
Estimativa.icone = #4B5563
Estimativa.destaque = @accentColor
Estimativa.botaoPrincipal = @accentColor
Estimativa.botaoPrincipalHover = darken(@accentColor,7%)
Estimativa.botaoPrincipalPressionado = darken(@accentColor,12%)
Estimativa.botaoPrincipalTexto = #FFFFFF
Estimativa.grafico1 = #2563EB
Estimativa.grafico2 = #16A34A
Estimativa.grafico3 = #F59E0B
Estimativa.grafico4 = #DC2626
Estimativa.grafico5 = #7C3AED
Estimativa.grafico6 = #0891B2
