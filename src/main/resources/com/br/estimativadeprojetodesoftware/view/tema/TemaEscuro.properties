# Tema escuro do sistema de estimativa
@accentColor = #5B8DEF
@background = #1E2128

# ---- forma e tipografia ----
defaultFont = +1
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.margin = 5,14,5,14
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 11
TabbedPane.tabHeight = 34
TabbedPane.tabSelectionHeight = 3
TitlePane.unifiedBackground = true
ToolBar.margin = 4,6,4,6

# ---- tabelas ----
Table.rowHeight = 26
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
TableHeader.height = 30
TableHeader.font = bold

# ---- arvore ----
Tree.rowHeight = 28

Table.alternateRowColor = #23272F
Table.gridColor = #30343C
Table.selectionBackground = #2C4775
Table.selectionForeground = #F3F4F6
Table.selectionInactiveBackground = #2A3240
Table.selectionInactiveForeground = #E5E7EB
TableHeader.background = #262A32
Desktop.background = #17191E
InternalFrame.activeTitleBackground = #262A32
InternalFrame.inactiveTitleBackground = #1F2228

# ---- cores do sistema ----
Estimativa.sucesso = #4ADE80
Estimativa.aviso = #FBBF24
Estimativa.erro = #F87171
Estimativa.na = #6B7280
Estimativa.cartao = #262A32
Estimativa.cartaoBorda = #343944
Estimativa.titulo = #F3F4F6
Estimativa.subtitulo = #9CA3AF
Estimativa.icone = #C9CDD4
Estimativa.destaque = @accentColor
Estimativa.botaoPrincipal = @accentColor
Estimativa.botaoPrincipalHover = darken(@accentColor,7%)
Estimativa.botaoPrincipalPressionado = darken(@accentColor,12%)
Estimativa.botaoPrincipalTexto = #FFFFFF
Estimativa.grafico1 = #5B8DEF
Estimativa.grafico2 = #4ADE80
Estimativa.grafico3 = #FBBF24
Estimativa.grafico4 = #F87171
Estimativa.grafico5 = #A78BFA
Estimativa.grafico6 = #22D3EE
